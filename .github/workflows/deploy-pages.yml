name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check playable prototype
        run: python3 scripts/check_prototype.py

  build-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp prototype.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: [test, build-pages, deploy-pages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build-pages.result }}
      DEPLOY_RESULT: ${{ needs.deploy-pages.result }}
      PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHORT_SHA: ${{ github.sha }}
    steps:
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY' | curl --fail --silent --show-error --request POST --header 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
          import json
          import os

          succeeded = all(
              os.environ[name] == "success"
              for name in ("TEST_RESULT", "BUILD_RESULT", "DEPLOY_RESULT")
          )
          if succeeded:
              content = "\n".join(
                  [
                      "🚀 Hundred Layers Prototype updated",
                      "",
                      "GitHub Pagesへの公開が完了しました。",
                      "",
                      f"Page: {os.environ['PAGE_URL']}",
                      f"Commit: {os.environ['COMMIT_URL']} ({os.environ['SHORT_SHA'][:7]})",
                  ]
              )
          else:
              content = "\n".join(
                  [
                      "❌ Hundred Layers deployment failed",
                      "",
                      "GitHub Actionsを確認してください。",
                      "",
                      f"Actions: {os.environ['RUN_URL']}",
                  ]
              )
          print(json.dumps({"content": content}, ensure_ascii=False))
          PY
