name: Prototype CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prototype-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Pages content
        run: |
          python3 scripts/check_prototype.py
          python3 scripts/check_status_page.py
