<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hundred-layers | 探索プロトタイプ</title>
<style>
:root{--bg:#171615;--panel:#c8bea3;--panel-deep:#b7ab8e;--ink:#302d26;--muted:#645f53;--line:#756a4b;--accent:#756a4b;--accent-light:#9b8d65;--good:#426b49;--danger:#8c4c40;--log-bg:#27241f;--log-text:#ddd4bf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#3a3429 0%,#171615 58%,#100f0e 100%);color:var(--ink);font-family:"Meiryo","Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif}.wrap{max-width:1060px;margin:auto;padding:18px}.header{margin-bottom:12px;padding:18px 20px;border:1px solid #8d7e59;background:linear-gradient(135deg,#383229,#211f1b);box-shadow:0 8px 28px rgba(0,0,0,.42)}.title{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:bold;letter-spacing:.08em;color:#e5d5a0;text-shadow:0 1px 0 #0d0c0a,0 0 10px rgba(208,179,102,.16)}.subtitle{margin-top:5px;color:#c6bda8;font-size:12px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.panel{border:1px solid var(--line);background:linear-gradient(135deg,#d1c7ac,var(--panel));box-shadow:0 6px 18px rgba(0,0,0,.3)}.panel+.panel{margin-top:12px}.panel h2{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#b8ab8d,#a99c7e);color:#302d26;font-size:14px;letter-spacing:.04em}.panel-body{padding:12px}.label{margin-top:10px;color:var(--muted);font-size:11px;letter-spacing:.12em}.label:first-child{margin-top:0}.value{margin-top:3px;color:var(--ink);font-size:16px;font-weight:bold}.bar{height:12px;margin-top:3px;overflow:hidden;border:1px solid #776b4e;background:#827758}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6f6246,#a89361);transition:width .25s}.bar.stamina i{background:linear-gradient(90deg,#506a45,#8c9f60)}.items{width:100%;margin-top:3px;border-collapse:collapse;font-size:13px}.items td{padding:4px 2px;border-bottom:1px dotted #897c5f}.items td:last-child{text-align:right}.save-line{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}.save-state{color:var(--good);font-weight:bold}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #766a4f;background:linear-gradient(#d8cfb7,#b9ad91);color:var(--ink);padding:8px 10px;font:inherit;cursor:pointer;transition:.08s;box-shadow:inset 0 1px rgba(255,255,255,.38)}button:hover:not(:disabled){filter:brightness(1.06)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.42;cursor:not-allowed}.menu button{min-height:42px}.menu-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.primary,.choices button.active{border-color:#66542e;background:linear-gradient(#8d7c4f,#6d5e3b);color:#fff7dc}.danger{border-color:#75463e;background:linear-gradient(#a8695d,#7c463c);color:#fff3e7}.screen-title{color:#443d2f;font-size:18px;font-weight:bold;margin-bottom:4px}.eyebrow{color:#6b6048;font-size:11px;letter-spacing:.12em;font-weight:bold}.lead{margin:10px 0;color:#4b463b;line-height:1.75}.choices{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.result{margin-top:16px;padding:10px;border-left:3px solid var(--accent);background:rgba(244,238,215,.45)}.result h3{margin:0 0 8px;color:#443d2f;font-size:14px}.event{padding:7px 0;border-top:1px solid #a79b7e;line-height:1.55}.delta{color:#695b35;font-weight:bold}.notice{margin:10px 0;padding:8px 10px;border:1px solid #887c5d;background:rgba(244,238,215,.52);color:#4d473b;font-size:13px}.notice.warning{border-color:#8b5549;color:#6e352d}.log{max-height:260px;overflow:auto;padding:0 10px 10px;background:var(--log-bg);font:12px/1.6 "Meiryo",monospace}.log-entry{padding:7px 0;border-bottom:1px dotted #665e50;color:var(--log-text)}.log-time{color:#ab9c7b}.history{padding:9px 10px;border-bottom:1px solid #a79b7e;font-size:12px}.history summary{cursor:pointer;color:#443d2f}.history div{margin-top:6px;color:#585145}.debug{border-color:#766a4f}.debug summary{padding:9px 10px;color:#443d2f;cursor:pointer}.debug div{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}.footer{margin-top:12px;text-align:center;color:#b7ad9b;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.title{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header"><div class="title">HUNDRED LAYERS</div><div class="subtitle">Playable Prototype v0.1.1 / 探索ループ検証用</div></header>
  <div class="layout">
    <aside>
      <section class="panel"><h2>冒険者情報</h2><div class="panel-body">
        <div class="label">スタミナ</div><div class="value" id="stamina"></div><div class="bar stamina"><i id="staminaBar"></i></div>
        <div class="label">現在地</div><div class="value" id="location"></div>
        <div class="label">開拓率</div><div class="value" id="progress"></div><div class="bar"><i id="progressBar"></i></div>
        <div class="label">所持品</div><table class="items"><tr><td>薬草</td><td id="itemHerb"></td></tr><tr><td>鉄鉱石</td><td id="itemOre"></td></tr><tr><td>古い硬貨</td><td id="itemCoin"></td></tr></table>
        <div class="save-line"><span>自動保存</span><span class="save-state" id="saveState">準備完了</span></div>
      </div></section>
      <section class="panel"><h2>プロトタイプ操作</h2><div class="panel-body"><button class="danger" id="reset" style="width:100%">プロトタイプを初期化</button></div></section>
    </aside>
    <main>
      <nav class="menu"><button id="commandTown" aria-label="町"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20v-8l4-3v11M9 20V6l4-3v17M13 20v-9l4-3v12M17 20v-5l2-1v6"/></svg><span>町</span></button><button class="primary" id="commandExplore" aria-label="探索"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m14.8 9.2-1.7 4-3.9 1.6 1.7-3.9 4-1.7ZM12 4v2M12 18v2M4 12h2M18 12h2"/></svg><span>探索</span></button><button id="commandRecords" aria-label="記録"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.4 4.3 8.8 4.3 12 6v13c-3.2-1.7-5.6-1.7-8 0v-13.5ZM20 5.5C17.6 4.3 15.2 4.3 12 6v13c3.2-1.7 5.6-1.7 8 0v-13.5Z"/><path d="M7 8h2M7 11h2M15 8h2M15 11h2"/></svg><span>記録</span></button></nav>
      <section class="panel"><h2 id="screenHeading">町</h2><div class="panel-body" id="screen"></div></section>
      <section class="panel" id="historyPanel"><h2>探索履歴</h2><div id="history"></div></section>
      <section class="panel"><h2>探索・システムログ</h2><div class="log" id="systemLog"></div></section>
      <details class="panel debug"><summary>プロトタイプ用デバッグ</summary><div><button data-debug="stamina">スタミナ +10</button><button data-debug="progress">開拓率 +10%</button><button data-debug="99">開拓率を99%にする</button></div></details>
    </main>
  </div>
  <div class="footer">hundred-layers exploration prototype / localStorage auto-save enabled</div>
</div>
<script>
const CONFIG={maxStamina:100,staminaRecoveryMs:60000,explorationCosts:[10,20,30,50],maxProgress:100,storageKey:'hundred-layers-prototype-v01',historyLimit:5,logLimit:60};
const ITEM_NAMES=['薬草','鉄鉱石','古い硬貨'];
const initial=()=>({stamina:100,lastStaminaUpdate:Date.now(),progress:0,items:{},history:[],systemLog:[],location:'town',lastResult:null,bossMessage:false});
let state=load(),saveTimer;
function load(){try{const saved=JSON.parse(localStorage.getItem(CONFIG.storageKey))||{},base=initial();return {...base,...saved,items:{...base.items,...(saved.items||{})},history:Array.isArray(saved.history)?saved.history:[],systemLog:Array.isArray(saved.systemLog)?saved.systemLog:[]}}catch{return initial()}}
function el(id){return document.getElementById(id)}
function showSaveState(){const target=el('saveState');if(!target)return;target.textContent='保存済み';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(el('saveState'))el('saveState').textContent='準備完了'},1100)}
function save(){localStorage.setItem(CONFIG.storageKey,JSON.stringify(state));showSaveState()}
function recover(){const n=Math.floor((Date.now()-state.lastStaminaUpdate)/CONFIG.staminaRecoveryMs);if(!n)return false;state.stamina=Math.min(CONFIG.maxStamina,state.stamina+n);state.lastStaminaUpdate+=n*CONFIG.staminaRecoveryMs;save();return true}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function writeLog(message){state.systemLog.unshift({at:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),message});state.systemLog=state.systemLog.slice(0,CONFIG.logLimit)}
function updateStatus(){el('stamina').textContent=`${state.stamina} / ${CONFIG.maxStamina}`;el('staminaBar').style.width=`${state.stamina}%`;el('location').textContent=state.location==='town'?'はじまりの街':'始まりの洞窟';el('progress').textContent=`${state.progress}%`;el('progressBar').style.width=`${state.progress}%`;el('itemHerb').textContent=`×${state.items['薬草']||0}`;el('itemOre').textContent=`×${state.items['鉄鉱石']||0}`;el('itemCoin').textContent=`×${state.items['古い硬貨']||0}`}
function render(){recover();updateStatus();const s=el('screen');if(state.location==='town'){el('screenHeading').textContent='町';s.innerHTML='<div class="eyebrow">開始地点</div><div class="screen-title">はじまりの街</div><p class="lead">100層の攻略はここから始まる。まずは洞窟を探索し、最深部への道を開こう。</p><button class="primary" id="move">始まりの洞窟へ</button>'}else if(state.progress>=100){el('screenHeading').textContent='洞窟・開拓完了';s.innerHTML=`<div class="eyebrow">開拓完了</div><div class="screen-title">始まりの洞窟 / 開拓完了</div><p class="lead">洞窟の最深部で巨大な扉を発見した。</p><div class="notice">ボスが解放されました</div><button class="primary" id="boss">ボス討伐</button> <button id="back">街へ戻る</button>${state.bossMessage?'<div class="result"><h3>ボス攻略</h3><p>この先は次のプロトタイプで実装予定です。今回は「探索 → ボス解放」までのゲームループを検証します。</p></div>':''}`}else cave(s);history();renderLog()}
function cave(s){el('screenHeading').textContent='探索';const available=CONFIG.explorationCosts.filter(n=>n<=state.stamina),selected=available[0];const costs=CONFIG.explorationCosts.map(n=>`<button class="cost ${n===selected?'active':''}" data-cost="${n}" ${n>state.stamina?'disabled':''}>スタミナ ${n}</button>`).join('');s.innerHTML=`<div class="eyebrow">洞窟 / 開拓率 ${state.progress}%</div><div class="screen-title">始まりの洞窟</div><p class="lead">今回の探索に投入するスタミナを選択してください。</p><div class="label">投入スタミナ</div><div class="choices">${costs}</div>${available.length?'':'<p class="notice warning">スタミナが不足しています。スタミナが10まで回復すると探索できます。</p>'}<button class="primary" id="explore" ${available.length?'':'disabled'}>探索開始</button> <button id="back">街へ戻る</button>${state.lastResult?resultHtml(state.lastResult):''}`;let current=selected;s.querySelectorAll('.cost').forEach(b=>b.onclick=()=>{current=+b.dataset.cost;s.querySelectorAll('.cost').forEach(x=>x.classList.toggle('active',x===b))});const exploreButton=s.querySelector('#explore');if(exploreButton)exploreButton.onclick=()=>explore(current)}
function explore(cost){recover();if(!cost||cost>state.stamina)return;const before=state.progress,events=[];writeLog(`スタミナ ${cost} を投入して探索を開始した。`);for(let i=0;i<cost/10;i++){const r=Math.random();let type,gain,text,item;if(r<.55){type='通常探索';gain=rand(5,8);text='奥へ続く通路を発見した。'}else if(r<.85){type='敵遭遇';gain=rand(2,4);text='ゴブリンの群れに遭遇した。戦闘に時間を取られた。'}else{type='アイテム発見';gain=rand(3,6);item=ITEM_NAMES[rand(0,2)];state.items[item]=(state.items[item]||0)+1;text=`古びた宝箱を発見した。「${item}」を手に入れた。`}gain=Math.min(gain,CONFIG.maxProgress-state.progress);state.progress+=gain;events.push({type,gain,text});writeLog(`${text} 開拓率 +${gain}%`)}state.stamina-=cost;state.lastStaminaUpdate=Date.now();state.lastResult={cost,before,after:state.progress,events,total:state.progress-before};state.history.unshift(state.lastResult);state.history=state.history.slice(0,CONFIG.historyLimit);writeLog(`開拓率 ${before}% → ${state.progress}%`);if(before<100&&state.progress>=100){writeLog('開拓率100%に到達した。');writeLog('ボスが解放された。')}save();render()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function resultHtml(r){return `<div class="result"><h3>今回の探索結果</h3><div>消費スタミナ：${r.cost}</div>${r.events.map((e,i)=>`<div class="event">${i+1}. ${esc(e.text)}<br><span class="delta">開拓率 +${e.gain}%</span></div>`).join('')}<strong>今回の開拓 +${r.total}%</strong><div>開拓率 ${r.before}% → ${r.after}%</div></div>`}
function history(){el('history').innerHTML=state.history.length?state.history.map((r,i)=>`<details class="history" ${i===0?'open':''}><summary>スタミナ ${r.cost} / +${r.total}% (${r.before}% → ${r.after}%)</summary>${r.events.map(e=>`<div>${esc(e.text)} <span class="delta">+${e.gain}%</span></div>`).join('')}</details>`).join(''):'<div class="history">まだ探索履歴はありません。</div>'}
function renderLog(){el('systemLog').innerHTML=state.systemLog.length?state.systemLog.map(entry=>`<div class="log-entry"><span class="log-time">[${esc(entry.at)}]</span> &gt; ${esc(entry.message)}</div>`).join(''):'<div class="log-entry">&gt; 探索の記録はまだありません。</div>'}
function move(location){if(state.location===location)return;const from=state.location==='town'?'はじまりの街':'始まりの洞窟',to=location==='town'?'はじまりの街':'始まりの洞窟';state.location=location;writeLog(`${from}から${to}へ移動した。`);save();render()}
function debug(action){recover();if(action==='stamina'){state.stamina=Math.min(100,state.stamina+10);writeLog('デバッグ: スタミナを10回復した。')}if(action==='progress'){const before=state.progress;state.progress=Math.min(100,state.progress+10);writeLog(`デバッグ: 開拓率 ${before}% → ${state.progress}%`);if(before<100&&state.progress>=100){writeLog('開拓率100%に到達した。');writeLog('ボスが解放された。')}}if(action==='99'){state.progress=99;writeLog('デバッグ: 開拓率を99%にした。')}save();render()}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.id==='move'||target.id==='commandExplore')move('cave');if(target.id==='back'||target.id==='commandTown')move('town');if(target.id==='commandRecords'){el('historyPanel').scrollIntoView({behavior:'smooth',block:'start'});el('historyPanel').querySelector('details')?.setAttribute('open','')}if(target.id==='boss'&&!state.bossMessage){state.bossMessage=true;writeLog('ボス討伐を選択した。ボス戦は次のプロトタイプで実装予定。');save();render()}if(target.id==='reset'&&confirm('すべてのプロトタイプ状態を初期化しますか？')){state=initial();writeLog('プロトタイプを初期化した。');save();render()}const action=target.dataset.debug;if(action)debug(action)});
render();setInterval(()=>{const recovered=recover();updateStatus();if(recovered&&state.location==='cave')render()},1000);
</script>
</body>
</html>
