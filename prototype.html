<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hundred-layers | 探索プロトタイプ</title>
<style>
:root{--bg:#0b0d12;--panel:#151923;--line:#3b4558;--text:#e9edf6;--muted:#9da8ba;--accent:#ffd35a;--good:#7be495;--blue:#75b7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#20283a 0%,#0b0d12 42%,#07090d 100%);color:var(--text);font-family:"MS PGothic","Meiryo",system-ui,sans-serif}.wrap{max-width:1060px;margin:auto;padding:18px}.header{margin-bottom:12px;padding:18px 20px;border:1px solid #536078;background:linear-gradient(#222a3a,#121722);box-shadow:0 8px 28px rgba(0,0,0,.35)}.title{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:bold;letter-spacing:.08em;color:#fff3b0;text-shadow:0 1px 0 #000,0 0 10px rgba(255,210,72,.18)}.subtitle{margin-top:5px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.panel{border:1px solid var(--line);background:rgba(21,25,35,.95);box-shadow:0 6px 18px rgba(0,0,0,.25)}.panel+.panel{margin-top:12px}.panel h2{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#283143,#1b2130);color:#fff4c2;font-size:14px}.panel-body{padding:12px}.label{margin-top:10px;color:var(--muted);font-size:11px;letter-spacing:.12em}.label:first-child{margin-top:0}.value{margin-top:3px;color:#fff;font-size:16px}.bar{height:12px;margin-top:3px;overflow:hidden;border:1px solid #313949;background:#090b10}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5a86dd,#85bcff);transition:width .25s}.bar.stamina i{background:linear-gradient(90deg,#3caf5b,#8af0a0)}.items{width:100%;margin-top:3px;border-collapse:collapse;font-size:13px}.items td{padding:4px 2px;border-bottom:1px dotted #343c4b}.items td:last-child{text-align:right}.save-line{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}.save-state{color:var(--good)}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}button{border:1px solid #59667c;background:linear-gradient(#303a4c,#202838);color:#f3f6ff;padding:8px 10px;font:inherit;cursor:pointer;transition:.08s}button:hover:not(:disabled){filter:brightness(1.15)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.42;cursor:not-allowed}.primary,.choices button.active{border-color:#a8892d;background:linear-gradient(#715c1e,#493b12);color:#fff1aa}.danger{border-color:#764141;background:linear-gradient(#5c2a2a,#351b1b)}.screen-title{color:var(--accent);font-size:18px;font-weight:bold;margin-bottom:4px}.eyebrow{color:var(--blue);font-size:11px;letter-spacing:.12em}.lead{margin:10px 0;color:#cbd3e0;line-height:1.75}.choices{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.result{margin-top:16px;padding:10px;border-left:3px solid var(--accent);background:#121722}.result h3{margin:0 0 8px;color:#fff4c2;font-size:14px}.event{padding:7px 0;border-top:1px solid #343c4b;line-height:1.55}.delta{color:#e8d98f}.notice{margin:10px 0;padding:8px 10px;border:1px solid #3b4558;background:#1a202c;color:#bdc6d5;font-size:13px}.notice.warning{border-color:#764141;color:#ffb0b0}.log{max-height:260px;overflow:auto;padding:0 10px 10px;background:#0d1017;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.log-entry{padding:7px 0;border-bottom:1px dotted #343c4b;color:#d7deea}.log-time{color:#7d8aa0}.history{padding:9px 10px;border-bottom:1px solid #343c4b;font-size:12px}.history summary{cursor:pointer;color:#d6deeb}.history div{margin-top:6px;color:#bdc6d5}.debug{border-color:#685e45}.debug summary{padding:9px 10px;color:#e8d98f;cursor:pointer}.debug div{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}.footer{margin-top:12px;text-align:center;color:#747f90;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.title{font-size:24px}}
.title,.log{font-family:inherit}
body{font-family:system-ui,"Noto Sans JP",sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header class="header"><div class="title">HUNDRED LAYERS</div><div class="subtitle">Playable Prototype v0.1.1 / 探索ループ検証用</div></header>
  <div class="layout">
    <aside>
      <section class="panel"><h2>EXPLORER STATUS</h2><div class="panel-body">
        <div class="label">STAMINA</div><div class="value" id="stamina"></div><div class="bar stamina"><i id="staminaBar"></i></div>
        <div class="label">LOCATION</div><div class="value" id="location"></div>
        <div class="label">EXPLORE</div><div class="value" id="progress"></div><div class="bar"><i id="progressBar"></i></div>
        <div class="label">ITEM</div><table class="items"><tr><td>薬草</td><td id="itemHerb"></td></tr><tr><td>鉄鉱石</td><td id="itemOre"></td></tr><tr><td>古い硬貨</td><td id="itemCoin"></td></tr></table>
        <div class="save-line"><span>AUTO SAVE</span><span class="save-state" id="saveState">READY</span></div>
      </div></section>
      <section class="panel"><h2>PROTOTYPE COMMAND</h2><div class="panel-body"><button class="danger" id="reset" style="width:100%">Prototype Reset</button></div></section>
    </aside>
    <main>
      <nav class="menu"><button id="commandTown">街</button><button class="primary" id="commandExplore">探索</button><button id="commandRecords">記録</button></nav>
      <section class="panel"><h2 id="screenHeading">TOWN</h2><div class="panel-body" id="screen"></div></section>
      <section class="panel" id="historyPanel"><h2>RECENT EXPLORATIONS</h2><div id="history"></div></section>
      <section class="panel"><h2>EXPLORE / SYSTEM LOG</h2><div class="log" id="systemLog"></div></section>
      <details class="panel debug"><summary>Prototype Debug</summary><div><button data-debug="stamina">+10 stamina</button><button data-debug="progress">開拓率 +10%</button><button data-debug="99">開拓率を99%にする</button></div></details>
    </main>
  </div>
  <div class="footer">hundred-layers exploration prototype / localStorage auto-save enabled</div>
</div>
<script>
const CONFIG={maxStamina:100,staminaRecoveryMs:60000,explorationCosts:[10,20,30,50],maxProgress:100,storageKey:'hundred-layers-prototype-v01',historyLimit:5,logLimit:60};
const ITEM_NAMES=['薬草','鉄鉱石','古い硬貨'];
const initial=()=>({stamina:100,lastStaminaUpdate:Date.now(),progress:0,items:{},history:[],systemLog:[],location:'town',lastResult:null,bossMessage:false});
let state=load(),saveTimer;
function load(){try{const saved=JSON.parse(localStorage.getItem(CONFIG.storageKey))||{},base=initial();return {...base,...saved,items:{...base.items,...(saved.items||{})},history:Array.isArray(saved.history)?saved.history:[],systemLog:Array.isArray(saved.systemLog)?saved.systemLog:[]}}catch{return initial()}}
function el(id){return document.getElementById(id)}
function showSaveState(){const target=el('saveState');if(!target)return;target.textContent='SAVED';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(el('saveState'))el('saveState').textContent='READY'},1100)}
function save(){localStorage.setItem(CONFIG.storageKey,JSON.stringify(state));showSaveState()}
function recover(){const n=Math.floor((Date.now()-state.lastStaminaUpdate)/CONFIG.staminaRecoveryMs);if(!n)return false;state.stamina=Math.min(CONFIG.maxStamina,state.stamina+n);state.lastStaminaUpdate+=n*CONFIG.staminaRecoveryMs;save();return true}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function writeLog(message){state.systemLog.unshift({at:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),message});state.systemLog=state.systemLog.slice(0,CONFIG.logLimit)}
function updateStatus(){el('stamina').textContent=`${state.stamina} / ${CONFIG.maxStamina}`;el('staminaBar').style.width=`${state.stamina}%`;el('location').textContent=state.location==='town'?'はじまりの街':'始まりの洞窟';el('progress').textContent=`${state.progress}%`;el('progressBar').style.width=`${state.progress}%`;el('itemHerb').textContent=`×${state.items['薬草']||0}`;el('itemOre').textContent=`×${state.items['鉄鉱石']||0}`;el('itemCoin').textContent=`×${state.items['古い硬貨']||0}`}
function render(){recover();updateStatus();const s=el('screen');if(state.location==='town'){el('screenHeading').textContent='TOWN';s.innerHTML='<div class="eyebrow">STARTING TOWN</div><div class="screen-title">はじまりの街</div><p class="lead">100層の攻略はここから始まる。まずは洞窟を探索し、最深部への道を開こう。</p><button class="primary" id="move">始まりの洞窟へ</button>'}else if(state.progress>=100){el('screenHeading').textContent='CAVE COMPLETE';s.innerHTML=`<div class="eyebrow">CAVE COMPLETE</div><div class="screen-title">始まりの洞窟 / 開拓完了</div><p class="lead">洞窟の最深部で巨大な扉を発見した。</p><div class="notice">BOSS UNLOCKED</div><button class="primary" id="boss">ボス討伐</button> <button id="back">街へ戻る</button>${state.bossMessage?'<div class="result"><h3>ボス攻略</h3><p>この先は次のプロトタイプで実装予定です。今回は「探索 → ボス解放」までのゲームループを検証します。</p></div>':''}`}else cave(s);history();renderLog()}
function cave(s){el('screenHeading').textContent='EXPLORE';const available=CONFIG.explorationCosts.filter(n=>n<=state.stamina),selected=available[0];const costs=CONFIG.explorationCosts.map(n=>`<button class="cost ${n===selected?'active':''}" data-cost="${n}" ${n>state.stamina?'disabled':''}>${n} STAMINA</button>`).join('');s.innerHTML=`<div class="eyebrow">CAVE / ${state.progress}% EXPLORED</div><div class="screen-title">始まりの洞窟</div><p class="lead">今回の探索に投入するスタミナを選択してください。</p><div class="label">投入スタミナ</div><div class="choices">${costs}</div>${available.length?'':'<p class="notice warning">スタミナが不足しています。10 STAMINAまで回復すると探索できます。</p>'}<button class="primary" id="explore" ${available.length?'':'disabled'}>探索開始</button> <button id="back">街へ戻る</button>${state.lastResult?resultHtml(state.lastResult):''}`;let current=selected;s.querySelectorAll('.cost').forEach(b=>b.onclick=()=>{current=+b.dataset.cost;s.querySelectorAll('.cost').forEach(x=>x.classList.toggle('active',x===b))});const exploreButton=s.querySelector('#explore');if(exploreButton)exploreButton.onclick=()=>explore(current)}
function explore(cost){recover();if(!cost||cost>state.stamina)return;const before=state.progress,events=[];writeLog(`${cost} STAMINA を投入して探索を開始した。`);for(let i=0;i<cost/10;i++){const r=Math.random();let type,gain,text,item;if(r<.55){type='通常探索';gain=rand(5,8);text='奥へ続く通路を発見した。'}else if(r<.85){type='敵遭遇';gain=rand(2,4);text='ゴブリンの群れに遭遇した。戦闘に時間を取られた。'}else{type='アイテム発見';gain=rand(3,6);item=ITEM_NAMES[rand(0,2)];state.items[item]=(state.items[item]||0)+1;text=`古びた宝箱を発見した。「${item}」を手に入れた。`}gain=Math.min(gain,CONFIG.maxProgress-state.progress);state.progress+=gain;events.push({type,gain,text});writeLog(`${text} 開拓率 +${gain}%`)}state.stamina-=cost;state.lastStaminaUpdate=Date.now();state.lastResult={cost,before,after:state.progress,events,total:state.progress-before};state.history.unshift(state.lastResult);state.history=state.history.slice(0,CONFIG.historyLimit);writeLog(`開拓率 ${before}% → ${state.progress}%`);if(before<100&&state.progress>=100){writeLog('開拓率100%に到達した。');writeLog('ボスが解放された。')}save();render()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function resultHtml(r){return `<div class="result"><h3>今回の探索結果</h3><div>消費スタミナ：${r.cost}</div>${r.events.map((e,i)=>`<div class="event">${i+1}. ${esc(e.text)}<br><span class="delta">開拓率 +${e.gain}%</span></div>`).join('')}<strong>今回の開拓 +${r.total}%</strong><div>開拓率 ${r.before}% → ${r.after}%</div></div>`}
function history(){el('history').innerHTML=state.history.length?state.history.map((r,i)=>`<details class="history" ${i===0?'open':''}><summary>${r.cost} STAMINA / +${r.total}% (${r.before}% → ${r.after}%)</summary>${r.events.map(e=>`<div>${esc(e.text)} <span class="delta">+${e.gain}%</span></div>`).join('')}</details>`).join(''):'<div class="history">まだ探索履歴はありません。</div>'}
function renderLog(){el('systemLog').innerHTML=state.systemLog.length?state.systemLog.map(entry=>`<div class="log-entry"><span class="log-time">[${esc(entry.at)}]</span> &gt; ${esc(entry.message)}</div>`).join(''):'<div class="log-entry">&gt; 探索の記録はまだありません。</div>'}
function move(location){if(state.location===location)return;const from=state.location==='town'?'はじまりの街':'始まりの洞窟',to=location==='town'?'はじまりの街':'始まりの洞窟';state.location=location;writeLog(`${from}から${to}へ移動した。`);save();render()}
function debug(action){recover();if(action==='stamina'){state.stamina=Math.min(100,state.stamina+10);writeLog('Debug: stamina を10回復した。')}if(action==='progress'){const before=state.progress;state.progress=Math.min(100,state.progress+10);writeLog(`Debug: 開拓率 ${before}% → ${state.progress}%`);if(before<100&&state.progress>=100){writeLog('開拓率100%に到達した。');writeLog('ボスが解放された。')}}if(action==='99'){state.progress=99;writeLog('Debug: 開拓率を99%にした。')}save();render()}
document.addEventListener('click',e=>{if(e.target.id==='move'||e.target.id==='commandExplore')move('cave');if(e.target.id==='back'||e.target.id==='commandTown')move('town');if(e.target.id==='commandRecords'){el('historyPanel').scrollIntoView({behavior:'smooth',block:'start'});el('historyPanel').querySelector('details')?.setAttribute('open','')}if(e.target.id==='boss'&&!state.bossMessage){state.bossMessage=true;writeLog('ボス討伐を選択した。ボス戦は次のプロトタイプで実装予定。');save();render()}if(e.target.id==='reset'&&confirm('すべてのプロトタイプ状態を初期化しますか？')){state=initial();writeLog('Prototype Resetを実行した。');save();render()}const action=e.target.dataset.debug;if(action)debug(action)});
render();setInterval(()=>{const recovered=recover();updateStatus();if(recovered&&state.location==='cave')render()},1000);
</script>
</body>
</html>
